# Render Blueprint — deploys the Next.js app as a Node web service.
#
# In the Render dashboard:  New +  →  Blueprint  →  connect this repo.
# Render reads this file, then prompts for the AI secrets marked `sync: false`.
services:
  - type: web
    name: vedaai-assignment
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    # `/` is a static 200; /api/health does live provider probes (too slow for a health check).
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Non-secret config (safe to keep in the blueprint).
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      # Secrets — set in the Render dashboard, never committed.
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_ROUTER_API_KEY
        sync: false
      - key: AGENT_ROUTER_BASE_URL
        value: https://co.agentrouter.org
      - key: AGENT_ROUTER_API_FORMAT
        value: auto
      - key: AGENT_ROUTER_MODELS
        value: claude-opus-4-8,claude-opus-5,glm-5.3,deepseek-v4-flash
